name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "tests/**"
      - "frontend/**"
  pull_request:
    branches: [main, dev]
    types:
      - opened
      - edited
      - synchronize
    paths:
      - "**.py"
      - "pyproject.toml"
      - "tests/**"
      - "frontend/**"
  workflow_call:  # Allow release.yml to call this workflow

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build && cd ..
          mkdir -p src/holysheet/renderer/assets
          cp frontend/dist/index.html src/holysheet/renderer/index.html
          cp frontend/dist/assets/*.js src/holysheet/renderer/assets/app.js
          cp frontend/dist/assets/*.css src/holysheet/renderer/assets/app.css 2>/dev/null || touch src/holysheet/renderer/assets/app.css

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/ examples/

      - name: Format check
        run: ruff format --check src/ tests/ examples/

      - name: Type check
        run: mypy src/holysheet/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # Coverage job (only on primary Python version)
  coverage:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build && cd ..
          mkdir -p src/holysheet/renderer/assets
          cp frontend/dist/index.html src/holysheet/renderer/index.html
          cp frontend/dist/assets/*.js src/holysheet/renderer/assets/app.js
          cp frontend/dist/assets/*.css src/holysheet/renderer/assets/app.css 2>/dev/null || touch src/holysheet/renderer/assets/app.css

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=holysheet --cov-report=xml --cov-report=html --cov-report=term-missing
        timeout-minutes: 20

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-holysheet
          fail_ci_if_error: false
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build && cd ..
          mkdir -p src/holysheet/renderer/assets
          cp frontend/dist/index.html src/holysheet/renderer/index.html
          cp frontend/dist/assets/*.js src/holysheet/renderer/assets/app.js
          cp frontend/dist/assets/*.css src/holysheet/renderer/assets/app.css 2>/dev/null || touch src/holysheet/renderer/assets/app.css

      - name: Build package
        run: |
          uv pip install --system build
          python -m build

      - name: Verify wheel contents
        run: |
          pip install dist/*.whl
          python -c "
          import holysheet
          from pathlib import Path
          import importlib.resources as res
          print(f'Version: {holysheet.__version__}')
          pkg_dir = Path(holysheet.__file__).parent
          assert (pkg_dir / 'renderer' / 'assets' / 'app.js').exists(), 'app.js missing from wheel!'
          assert (pkg_dir / 'templates' / 'standalone.html.j2').exists(), 'template missing from wheel!'
          print('✓ All assets verified in wheel')
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

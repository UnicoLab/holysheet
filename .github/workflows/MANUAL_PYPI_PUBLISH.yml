name: "Manual PyPI Publish"

on:
  workflow_dispatch:
    inputs:
      RELEASE_VERSION:
        required: true
        type: string
        description: "Release version to publish to PyPI (e.g. 0.5.0)"

permissions:
  contents: write

jobs:
  PYPI_PUBLISH:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install build tools
        run: uv pip install --system build twine

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Set version
        run: |
          echo "Setting package version to ${{ inputs.RELEASE_VERSION }}"
          sed -i 's/^version = .*/version = "${{ inputs.RELEASE_VERSION }}"/' pyproject.toml
          sed -i 's/^__version__ = .*/__version__ = "${{ inputs.RELEASE_VERSION }}"/' src/holysheet/__init__.py

      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build && cd ..
          mkdir -p src/holysheet/renderer/assets
          cp frontend/dist/index.html src/holysheet/renderer/index.html
          cp frontend/dist/assets/*.js src/holysheet/renderer/assets/app.js
          cp frontend/dist/assets/*.css src/holysheet/renderer/assets/app.css 2>/dev/null || touch src/holysheet/renderer/assets/app.css

      - name: Verify renderer assets
        run: |
          test -f src/holysheet/renderer/assets/app.js || (echo "FATAL: app.js missing" && exit 1)
          echo "✓ Renderer assets verified: $(du -sh src/holysheet/renderer/assets/)"

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        id: publish_pypi
        run: |
          twine upload dist/* --username __token__ --password "$PYPI_TOKEN"
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        continue-on-error: true

      - name: Retry PyPI publish on failure
        if: steps.publish_pypi.outcome == 'failure'
        run: |
          echo "First attempt failed, retrying..."
          sleep 10
          rm -rf dist
          python -m build
          twine upload dist/* --username __token__ --password "$PYPI_TOKEN"
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Publish summary
        if: always()
        run: |
          echo "## Manual PyPI Publish" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ inputs.RELEASE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status  | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY

name: "Manual Docs Publish"

on:
  workflow_dispatch:
    inputs:
      RELEASE_VERSION:
        required: true
        type: string
        description: "Version to deploy docs for (e.g. 0.5)"
      SET_LATEST:
        required: true
        type: boolean
        default: true
        description: "Update the 'latest' alias to point to this version"

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          pip install \
            "mkdocs>=1.6" \
            "mkdocs-material>=9.5" \
            "mkdocstrings[python]>=0.24" \
            "mkdocs-minify-plugin>=0.8" \
            "mike>=2.1"

      - name: Configure Git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        id: deploy_docs
        run: |
          echo "Deploying documentation for version ${{ inputs.RELEASE_VERSION }}"
          if [[ "${{ inputs.SET_LATEST }}" == "true" ]]; then
            mike deploy --push --update-aliases ${{ inputs.RELEASE_VERSION }} latest
            mike set-default --push latest
            echo "✅ Deployed ${{ inputs.RELEASE_VERSION }} with 'latest' alias"
          else
            mike deploy --push ${{ inputs.RELEASE_VERSION }}
            echo "✅ Deployed ${{ inputs.RELEASE_VERSION }}"
          fi
        continue-on-error: true

      - name: Retry on failure
        if: steps.deploy_docs.outcome == 'failure'
        run: |
          echo "First attempt failed, retrying with --force..."
          git fetch origin gh-pages:gh-pages --force
          if [[ "${{ inputs.SET_LATEST }}" == "true" ]]; then
            mike deploy --push --update-aliases --force ${{ inputs.RELEASE_VERSION }} latest
            mike set-default --push latest
          else
            mike deploy --push --force ${{ inputs.RELEASE_VERSION }}
          fi

      - name: Deploy summary
        if: always()
        run: |
          echo "## Manual Docs Deploy" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ inputs.RELEASE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Set Latest | \`${{ inputs.SET_LATEST }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY

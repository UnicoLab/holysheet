name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no publish, no tag)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force:
        description: "Force a release even if no qualifying commits"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  id-token: write

jobs:
  # ── Gate: wait for CI to pass ─────────────────────────────────
  ci:
    uses: ./.github/workflows/ci.yml

  # ── Semantic Release + PyPI ───────────────────────────────────
  release:
    needs: ci
    runs-on: ubuntu-latest
    concurrency: release
    if: github.repository_owner == 'UnicoLab'

    environment:
      name: pypi
      url: https://pypi.org/project/holysheet/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install semantic-release
        run: uv pip install --system python-semantic-release>=9.0

      # ── Build frontend assets ─────────────────────────────────
      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build
          cd ..
          mkdir -p src/holysheet/renderer/assets
          cp frontend/dist/index.html src/holysheet/renderer/index.html
          cp frontend/dist/assets/*.js src/holysheet/renderer/assets/app.js
          cp frontend/dist/assets/*.css src/holysheet/renderer/assets/app.css 2>/dev/null || touch src/holysheet/renderer/assets/app.css

      - name: Verify renderer assets
        run: |
          test -f src/holysheet/renderer/assets/app.js || (echo "FATAL: app.js missing" && exit 1)
          echo "✓ Renderer assets verified: $(du -sh src/holysheet/renderer/assets/)"

      # ── Semantic Release: version bump + changelog + tag ──────
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9.21.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: ${{ github.event.inputs.force || 'false' }}
          root_options: ${{ github.event.inputs.dry_run == 'true' && '--noop' || '' }}

      # ── Publish to PyPI (trusted publishing) ──────────────────
      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      # ── Upload to GitHub Releases ─────────────────────────────
      - name: Publish to GitHub Releases
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v9.21.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

      # ── Summary ───────────────────────────────────────────────
      - name: Release summary
        if: always()
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Released | \`${{ steps.release.outputs.released }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version  | \`${{ steps.release.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag      | \`${{ steps.release.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Dry Run  | \`${{ github.event.inputs.dry_run || 'false' }}\` |" >> $GITHUB_STEP_SUMMARY

site_name: HolySheet
site_url: https://unicolab.github.io/holysheet
site_description: Python-first report compiler that generates beautiful, interactive React dashboards.
site_author: UnicoLab

repo_name: UnicoLab/holysheet
repo_url: https://github.com/UnicoLab/holysheet

copyright: Copyright &copy; 2024-2026 UnicoLab

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/UnicoLab/holysheet
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/holysheet/

  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Block Types:
    - Overview: blocks/index.md
    - KPIs & Metrics: blocks/kpi-metrics.md
    - Charts: blocks/charts.md
    - Data & Content: blocks/data-content.md
    - Layout: blocks/layout.md
    - Interactive: blocks/interactive.md
  - Data Sources: data-sources.md
  - Themes: themes.md
  - Export & Deploy: export.md
  - API Reference: api-reference.md
  - Examples: examples.md
  - Changelog: changelog.md
